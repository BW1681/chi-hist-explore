.find-obj.correct{animation:glowWin .7s ease;background:linear-gradient(180deg,#d3f9d8,#8ce99a)!important;border-color:#2f9e44;box-shadow:0 0 0 4px rgba(64,192,87,.45),0 8px 0 #2f9e44;z-index:5}
.find-obj.decoy{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(233,236,239,.85));border-style:dashed;opacity:.9}

@keyframes floatPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes shakeObj{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.toast{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:8;background:rgba(26,18,11,.92);color:#fff8ef;font-weight:900;font-size:14px;padding:10px 16px;border-radius:999px;border:2px solid #f3e5c2;box-shadow:0 6px 16px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .2s}

.input-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.praise{pointer-events:none;position:absolute;left:50%;top:8%;transform:translateX(-50%) scale(.7);z-index:8;text-align:center;min-width:55%;animation:praisePop 1.7s cubic-bezier(.2,1.2,.3,1) forwards;opacity:0}

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">

<header>
  <h1>📜 中國歷史尋找答案 <span class="badge">中一 · 第一冊 · 場景探索</span></h1>
  <p>根據香港教育圖書《樂學中國歷史》第一冊網上課本要點。先揀單元，再入課題場景；喺竹簡／青銅／卷軸之間搵答案。計時可選、只計第一次答對；答錯要繼續搵；結算先公佈正確答案。</p>

  s=(s||"").replace(/\s/g,"").replace(/　/g,"");
  s=s.replace(/[Ａ-Ｚａ-ｚ０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  return s;
}
function matchInput(user, item){
  const u=norm(user); if(!u) return false;
  const answers=[item.ans].concat(item.accept||[]);
  return answers.some(a=>norm(a)===u || norm(a)===u.replace(/[。！？!?，,、]/g,""));
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function rand(a,b){ return a+Math.random()*(b-a); }
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}
function beep(kind){
  if(!soundOn) return;
  ensureAudio(); if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  const now=audioCtx.currentTime;
  if(kind==="ok"){ o.type="triangle"; o.frequency.setValueAtTime(523,now); o.frequency.exponentialRampToValueAtTime(784,now+.12); g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.18,now+.02); g.gain.exponentialRampToValueAtTime(.0001,now+.28); o.start(now); o.stop(now+.3); }
  else if(kind==="bad"){ o.type="square"; o.frequency.setValueAtTime(200,now); o.frequency.linearRampToValueAtTime(140,now+.15); g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.1,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+.2); o.start(now); o.stop(now+.22); }
  else if(kind==="hint"){ o.type="sine"; o.frequency.setValueAtTime(440,now); o.frequency.exponentialRampToValueAtTime(880,now+.18); g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.1,now+.02); g.gain.exponentialRampToValueAtTime(.0001,now+.22); o.start(now); o.stop(now+.24); }
  else { o.type="sine"; o.frequency.value=660; g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.08,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+.1); o.start(now); o.stop(now+.12); }
}

function shade(hex){
  try{
    const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.max(0,r-40); g=Math.max(0,g-40); b=Math.max(0,b-40);
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }catch(e){ return hex; }
}

function scatterPositions(n){
  n=Math.max(1,n|0);
  let cols, rows;
  if(n<=1){ cols=1; rows=1; }
  else if(n===2){ cols=2; rows=1; }
  else if(n<=4){ cols=2; rows=2; }
  else if(n<=6){ cols=3; rows=2; }
  else { cols=3; rows=3; }
  while(cols*rows<n){ if(cols<=rows) cols++; else rows++; }
  const marginX=2, marginY=5;
  const cellW=(100-2*marginX)/cols;
  const cellH=(100-2*marginY)/rows;
  const footW=Math.min(32, cellW*0.92);
  const footH=Math.min(22, cellH*0.85);
  const cells=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) cells.push([c,r]);
  const sh=shuffle(cells);
  const out=[];
  for(let i=0;i<n;i++){
    const [c,r]=sh[i%sh.length];
    const cellLeft=marginX+c*cellW;
    const cellTop=marginY+r*cellH;
    const maxLeft=cellLeft+Math.max(0, cellW-footW);
    const maxTop=cellTop+Math.max(0, cellH-footH);
    const baseLeft=(cellLeft+maxLeft)/2;
    const baseTop=(cellTop+maxTop)/2;
    let left=baseLeft+rand(-3,3);
    let top=baseTop+rand(-3,3);
    left=Math.max(cellLeft, Math.min(maxLeft, left));
    top=Math.max(cellTop, Math.min(maxTop, top));
    left=Math.max(1, Math.min(100-footW-1, left));
    top=Math.max(2, Math.min(100-footH-2, top));
    out.push({left, top, delay: rand(0,1.0), dur: rand(2.4,3.6)});
  }
  return out;
}

}

      }
    },250);

function mixMc(item){
  if(item.kind!=="mc") return item;
  const opts=item.opts.map((t,i)=>({t,i}));
  const sh=shuffle(opts);
  return Object.assign({}, item, {opts:sh.map(o=>o.t), ans:sh.findIndex(o=>o.i===item.ans), _orig:item});
}
function correctText(item){
  if(item.kind==="mc") return item.opts[item.ans];
  return item.ans+(item.accept&&item.accept.length?"（亦可："+item.accept.join("／")+"）":"");
}

      const el=document.getElementById("paperLeft"); const bar=document.getElementById("paperBar");
      const box=document.getElementById("qTimerBox");
      if(el) el.textContent="剩餘 "+formatMmSs(left);
      if(bar) bar.style.width=Math.max(0,Math.min(100,(left/(timerMins*60))*100))+"%";
      if(box) box.classList.toggle("warn", left<=60);
    },200);
  }
}

function placeMcObjects(item){
  const host=document.getElementById("sceneObjs");
  const nDecoy = Math.random()<.7 ? 1 : 2;
  const total = item.opts.length + nDecoy;
  const pos = scatterPositions(total);
  const icons = shuffle(OBJ_ICONS.slice());
  const items = item.opts.map((t,i)=>({kind:"opt", idx:i, text:t, ico:icons[i%icons.length]}));
  for(let d=0;d<nDecoy;d++){
    items.push({kind:"decoy", idx:-1, text:"裝飾", ico:DECOY_ICONS[(Math.random()*DECOY_ICONS.length)|0]});
  }
  const order = shuffle(items);
  order.forEach((o,i)=>{
    const p=pos[i];
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="find-obj"+(o.kind==="decoy"?" decoy":"");
    btn.style.left=p.left+"%";
    btn.style.top=p.top+"%";
    btn.style.animationDuration=p.dur+"s";
    btn.style.animationDelay=p.delay+"s";
    btn.dataset.kind=o.kind;
    if(o.kind==="opt") btn.dataset.i=String(o.idx);
    const short = o.kind==="decoy" ? "？" : (o.text.length>28 ? o.text.slice(0,26)+"…" : o.text);
    btn.innerHTML=`<span class="ico">${o.ico}</span><span class="lbl">${esc(short)}</span>`;
    btn.title = o.kind==="decoy" ? "裝飾物" : o.text;
    btn.onclick=()=>{
      if(locked||paperTimedOut) return;
      if(o.kind==="decoy"){
        btn.classList.add("wrong");
        showToast(DECOY_MSGS[(Math.random()*DECOY_MSGS.length)|0]);
        beep("tap");
        const wrap=document.getElementById("sceneWrap");
        if(wrap){ wrap.classList.remove("scene-shake"); void wrap.offsetWidth; wrap.classList.add("scene-shake"); }
        return;
      }
      const ok = o.idx === item.ans;
      if(ok){
        locked=true;
        btn.classList.add("correct");
        host.querySelectorAll(".find-obj").forEach(b=>b.disabled=true);
        afterAnswer(true, item.opts[o.idx], firstTryOk?1:0);
      } else {
        btn.classList.add("wrong");
        btn.disabled=true;
        showToast(WRONG_MSGS[(Math.random()*WRONG_MSGS.length)|0]);
        const wrap=document.getElementById("sceneWrap");
        if(wrap){ wrap.classList.remove("scene-shake"); void wrap.offsetWidth; wrap.classList.add("scene-shake"); }
        afterAnswer(false, item.opts[o.idx], 0);
      }
    };
    host.appendChild(btn);
  });
}

function placeInputClues(item){
  const host=document.getElementById("sceneObjs");
  const nFake = 3 + ((Math.random()*2)|0);
  const total = nFake + 1;
  const pos = scatterPositions(total);
  const icons = shuffle(OBJ_ICONS.concat(DECOY_ICONS));
  const fakeLabels = shuffle(CLUE_FAKE.concat(["地圖碎片","舊標籤","空白信封"]));
  const objs = [{kind:"real", text:item.ans, ico:icons[0]}];
  for(let i=0;i<nFake;i++) objs.push({kind:"fake", text:fakeLabels[i%fakeLabels.length], ico:icons[(i+1)%icons.length]});
  shuffle(objs).forEach((o,i)=>{
    const p=pos[i];
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="find-obj"+(o.kind==="fake"?" decoy":"");
    btn.style.left=p.left+"%";
    btn.style.top=p.top+"%";
    btn.style.animationDuration=p.dur+"s";
    btn.style.animationDelay=p.delay+"s";
    btn.dataset.kind=o.kind;
    btn.innerHTML=`<span class="ico">${o.ico}</span><span class="lbl">${o.kind==="real"?"神秘線索":esc(o.text)}</span>`;
    btn.onclick=()=>{
      if(locked||paperTimedOut||clueRevealed) return;
      if(o.kind==="fake"){
        btn.classList.add("wrong");
        btn.disabled=true;
        showToast(Math.random()<.5 ? "再搵～" : ("寫住「"+o.text+"」…無關"));
        beep("bad");
        const why=document.getElementById("why");
        if(why) why.innerHTML=`<span style="color:#868e96">呢個唔係答案線索，繼續搵！</span>`;
        return;
      }
      clueRevealed=true;
      btn.classList.add("clue-found");
      btn.innerHTML=`<span class="ico">✨</span><span class="lbl">${esc(item.ans)}</span>`;
      host.querySelectorAll(".find-obj").forEach(b=>{ if(b!==btn) b.disabled=true; });
      beep("hint");
      const book=document.getElementById("clueBook");
      book.classList.add("show");
      book.innerHTML=`📒 線索簿：答案字詞係「<strong>${esc(item.ans)}</strong>」——而家輸入確認啦！`;
      const area=document.getElementById("inputArea");
      area.innerHTML=`<div class="input-row"><input id="ansIn" type="text" autocomplete="off" enterkeyhint="done" placeholder="輸入你搵到嘅答案"><button type="button" class="go" id="ansGo" style="width:auto;flex:0 0 auto;padding:12px 18px">提交</button></div>`;
      const go=()=>answerInput();
      document.getElementById("ansGo").onclick=go;
      document.getElementById("ansIn").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } };
      setTimeout(()=>{ const inp=document.getElementById("ansIn"); if(inp) inp.focus(); },150);
      showToast("搵到線索！");
    };
    host.appendChild(btn);
  });
}

function softHint(){
  if(locked||paperTimedOut) return;
  const objs=[...document.querySelectorAll(".find-obj:not(.wrong):not([disabled])")];
  if(!objs.length){ showToast("冇剩餘物件啦"); return; }
  objs.forEach(b=>{
    b.classList.add("hint-glow");
    setTimeout(()=>b.classList.remove("hint-glow"), 1400);
  });
  beep("hint");
  showToast("微光：未試過嘅物件閃咗一下～");
  hintUsed=true;
}

function answerInput(){
  if(locked||paperTimedOut) return;
  if(!clueRevealed){ showToast("先喺場景搵線索物！"); return; }
  const item=curIsland._cur;
  const inp=document.getElementById("ansIn");
  const val=(inp&&inp.value||"").trim();
  if(!val){ document.getElementById("why").textContent="請先輸入答案啦～"; return; }
  const ok=matchInput(val, item);
  if(ok){
    locked=true; if(inp) inp.disabled=true;
    const go=document.getElementById("ansGo"); if(go) go.disabled=true;
    afterAnswer(true, val, firstTryOk?1:0);
  } else {
    afterAnswer(false, val, 0);
    if(inp){ inp.select(); }
  }
}

function settle(fromTimeout){
  clearPaperTimer(); clearQTick(); locked=true;
  if(fromTimeout){
    const leftQs=playQuestions();
    for(let i=qi;i<leftQs.length;i++){
      const it=leftQs[i];
      paperLog.push({q:it.q, ok:false, first:false, user:"（時間到未作答）", correct: it.kind==="mc"?it.opts[it.ans]:it.ans, src:it.src, pts:0});
    }
  }
  totalScore+=paperScore;
  if(paperScore>=Math.ceil(paperTotal*0.6)) cleared[curIsland.id]=1;
  const pct=paperTotal?Math.round(paperScore/paperTotal*100):0;
  let encourage;
  if(pct>=90) encourage="🌟 優秀！幾乎滿分，中史尋答案達人！";
  else if(pct>=75) encourage="👏 好叻！繼續保持，好穩陣！";
  else if(pct>=60) encourage="💪 過關啦！錯題再溫習會更穩！";
  else if(pct>=40) encourage="🌈 已有基礎，返課題再練就會進步！";
  else encourage="🌱 唔緊要，對照答案再挑戰同一課題啦！";
  document.getElementById("ptitle").textContent=(fromTimeout?"⏰ 時間到 · ":"🎉 完成 · ")+curIsland.name;
  const top=document.getElementById("ptop"); top.innerHTML="";
  const back=document.createElement("button"); back.type="button"; back.textContent="← 返回課題";
  back.onclick=()=>{ showPanel(false); renderMap(); };
  top.appendChild(back);
  let items="";
  paperLog.forEach((L,i)=>{
    items+=`<div class="report-item ${L.ok||L.pts?"ok":"ng"}"><strong>第 ${i+1} 題</strong> <span class="src-tag">${esc(L.src||"")}</span><br>${esc(L.q)}<br>
    你嘅答案：${esc(L.user)}<br>正確答案：<strong>${esc(L.correct)}</strong> · ${L.pts?"+1":"0 分"}</div>`;
  });
  document.getElementById("pbody").innerHTML=`
    <div class="report-sum">${esc(activeLevelLabel||"本課題")}得分 <strong>${paperScore} / ${paperTotal}</strong>（${pct}%）${fromTimeout?" · 因計時結束交卷":""}<br>累計總分 ${totalScore}</div>
    <div class="report-encourage">${encourage}</div>
    <h3 style="margin:12px 0 6px;font-size:16px">📋 逐題分析</h3>
    ${items}
    <button type="button" class="go" id="againBtn">🔄 再挑戰本課題</button>
    <button type="button" class="go" id="mapBtn" style="background:linear-gradient(180deg,#e8d5a8,#c9a66b);border-color:#8b6914;color:#3d2914;box-shadow:0 5px 0 #5c3d1e">🗺️ 返回課題選單</button>`;
  const mapBtn=document.getElementById("mapBtn");
  if(mapBtn){ mapBtn.onclick=()=>{ showPanel(false); renderMap(); }; }
  document.getElementById("againBtn").onclick=()=>{ showPanel(false); renderLevels(); };

  try{
    if(window.P5Platform && P5Platform.hasPlayer){
      P5Platform.report({
        gameId:"chi-hist-explore", game:"中國歷史尋找答案・場景", mode: curIsland.unitKey||"explore",
        lesson: (curIsland.unitTitle||"")+"｜"+curIsland.name,
        detail: (fromTimeout?"timeout":"done")+" · "+paperScore+"/"+paperTotal,
        score: paperScore, maxScore: paperTotal, pct: pct
      });
      const cardEl=document.getElementById("card");
      if(cardEl) P5Platform.appendReturn(cardEl);
    }
  }catch(_p5e){}
  updateHud(); beep(pct>=60?"ok":"bad");
}

document.getElementById("sndBtn").onclick=function(){
  soundOn=!soundOn; this.classList.toggle("on",soundOn);
  this.textContent=soundOn?"🔊 音效：開":"🔇 音效：關";
  this.setAttribute("aria-pressed", soundOn?"true":"false");
  if(soundOn){ ensureAudio(); beep("tap"); }
};
document.getElementById("sndBtn").classList.add("on");

const GAME_ID = "chi-hist-explore";
const GATE_KEY = GAME_ID + "_session_ok";
const GATE_CODE = String.fromCharCode(49,54,56,49); /* 1681 */
function gateUnlocked(){
  try{ return sessionStorage.getItem(GATE_KEY)==="1"; }catch(e){ return false; }
}
function markGateUnlocked(){
  try{ sessionStorage.setItem(GATE_KEY,"1"); }catch(e){}
}
function hideGate(){
  const g=document.getElementById("gate");
  if(g) g.classList.add("pass-ok");
}
function showGateError(msg){
  const el=document.getElementById("gateErr");
  if(el) el.textContent=msg||"";
}
function tryGateUnlock(){
  const inp=document.getElementById("gatePass");
  const raw=inp?String(inp.value||""):"";
  if(raw===GATE_CODE){
    markGateUnlocked();
    hideGate();
    showGateError("");
    renderMap();
  } else {
    showGateError("密碼錯誤。");
    if(inp){ inp.value=""; inp.focus(); }
  }
}
function boot(){
  if(gateUnlocked()){
    hideGate();
    renderMap();
    return;
  }
  const enter=document.getElementById("gateEnter");
  const inp=document.getElementById("gatePass");
  if(enter) enter.onclick=tryGateUnlock;
  if(inp){
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); tryGateUnlock(); }});
    setTimeout(()=>inp.focus(), 50);
  }
}
boot();
